syntax = "proto3";

package snowflake;
option go_package = "snowflake/pkg/proto;snowflakepb";

service SnowflakeService {
    rpc GenerateID(GenerateIDRequest) returns (GenerateIDResponse);
    rpc ParseID(ParseIDRequest) returns (ParseIDResponse);
    rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);
}

message GenerateIDRequest {}
message GenerateIDResponse {
    int64 id = 1;
    string id_str = 2;
}

message ParseIDRequest {
    int64 id = 1;
}
message ParseIDResponse {
    int64 id = 1;
    int64 timestamp_ms = 2;
    string timestamp_iso = 3;
    int64 worker_id = 4;
    int64 sequence = 5;
}

message GetServerStatusRequest {}
message GetServerStatusResponse {
    int64 worker_id = 1;
    int64 current_timestamp = 2;
    int64 epoch = 3;
}
